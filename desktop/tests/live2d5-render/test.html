<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live2D Cubism 5 渲染测试</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; width: 400px; height: 500px; }
    #status { color: #0f0; font: 14px monospace; padding: 8px; white-space: pre; }
    #error { color: #f00; font: 14px monospace; padding: 8px; white-space: pre; }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="500"></canvas>
  <div id="status">加载中...</div>
  <div id="error"></div>

  <!-- ① 先加载 Cubism 5 Core SDK -->
  <script src="/lib/live2dcubismcore5.min.js"></script>

  <!-- ② 加载打包好的模块代码 -->
  <script src="/bundle.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    function log(msg) {
      console.log(msg);
      statusEl.textContent += '\n' + msg;
    }
    function err(msg) {
      console.error(msg);
      errorEl.textContent += '\n' + msg;
    }

    async function main() {
      try {
        // 检查 Core SDK
        if (!window.Live2DCubismCore) {
          err('❌ Live2DCubismCore 未加载');
          window.__testResult = { ok: false, error: 'Core SDK not loaded' };
          return;
        }
        log('✅ Live2DCubismCore 已加载, version: ' + Live2DCubismCore.Version.csmGetVersion());

        // 检查模块
        if (!window.Live2D5Test) {
          err('❌ Live2D5Test 模块未加载');
          window.__testResult = { ok: false, error: 'Module not loaded' };
          return;
        }
        log('✅ Live2D5Test 模块已加载');

        // ③ 初始化 GL（与 cubism5-service.ts 一致）
        const glOptions = {
          alpha: true,
          premultipliedAlpha: true,
          antialias: true,
          preserveDrawingBuffer: true,
        };
        const gl = canvas.getContext('webgl2', glOptions) || canvas.getContext('webgl', glOptions);
        if (!gl) {
          err('❌ WebGL 不可用');
          window.__testResult = { ok: false, error: 'WebGL not available' };
          return;
        }
        const glVersion = gl instanceof WebGL2RenderingContext ? 'WebGL2' : 'WebGL1';
        log('✅ GL 上下文: ' + glVersion);
        gl.viewport(0, 0, canvas.width, canvas.height);

        // 暴露 GL 到 window（供 Live2D5Test.loadModel 使用）
        window.__testGl = gl;

        // ④ 初始化 Cubism Framework
        Live2D5Test.initFramework();
        log('✅ Cubism Framework 已初始化');

        // ⑤ 加载模型（Ren）
        log('🔄 开始加载模型...');
        const model = await Live2D5Test.loadModel('./live2d/Ren/Ren.model3.json', 0.85);
        log('✅ 模型加载完成');
        window.__testModel = model;

        // 检查模型信息
        const modelObj = model.getModel();
        const drawableCount = modelObj ? modelObj.getDrawableCount() : 0;
        log('📋 Drawable 数量: ' + drawableCount);

        // ⑤b 设置 PMA
        const renderer = model.getRenderer();
        if (renderer) {
          renderer.setIsPremultipliedAlpha(true);
        }

        // ⑥ 先渲染一次触发 shader 加载
        log('🔄 触发第一帧渲染（启动 shader 异步加载）...');
        Live2D5Test.renderFrame(gl, canvas, model);

        // ⑦ 等待 shader 加载完成
        log('🔄 等待 shader 加载...');
        const shaderOk = await Live2D5Test.waitForShaders(15000);
        if (!shaderOk) {
          err('❌ shader 加载超时');
          window.__testResult = { ok: false, error: 'Shader load timeout' };
          return;
        }
        log('✅ shader 加载完成');

        // ⑧ 渲染诊断
        log('🔍 渲染诊断...');
        const mdl = model.getModel ? model.getModel() : null;
        if (mdl) {
          const dc = mdl.getDrawableCount();
          let visCount = 0;
          for (let i = 0; i < dc; i++) {
            if (mdl.getDrawableDynamicFlagIsVisible(i)) visCount++;
          }
          log('📋 可见 Drawables: ' + visCount + '/' + dc);
          const orders = mdl.getRenderOrders();
          log('📋 前5渲染顺序: ' + Array.from(orders).slice(0, 5).join(','));
        }

        // ⑨ 渲染第一帧
        log('🔄 渲染第一帧...');
        Live2D5Test.renderFrame(gl, canvas, model);
        log('✅ 渲染调用完成');

        // 检查 canvas 像素
        const centerX = Math.floor(canvas.width / 2);
        const centerY = Math.floor(canvas.height / 2);
        const px = new Uint8Array(4);
        gl.readPixels(centerX, centerY, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        log('🔍 canvas 中心: RGBA=[' + px[0] + ',' + px[1] + ',' + px[2] + ',' + px[3] + ']');

        // 判断结果
        const hasContent = px[3] > 0;
        window.__testResult = {
          ok: hasContent,
          glVersion,
          drawableCount,
          centerAlpha: px[3],
          canvasSize: canvas.width + 'x' + canvas.height,
        };

        if (hasContent) {
          log('🎉 渲染成功！模型有像素输出，alpha=' + px[3]);
        } else {
          err('⚠️ 渲染后 canvas 全透明');
        }

      } catch (e) {
        err('❌ 异常: ' + e.message + '\n' + e.stack);
        window.__testResult = { ok: false, error: e.message, stack: e.stack };
      }
    }

    main();
  </script>
</body>
</html>
